[project]
name = "meu-projeto"
version = "0.1.0"
description = ""
authors = [
    {name = "Thaylla Sofia",email = "thayllapd09@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "typos (>=1.52.2,<2.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']